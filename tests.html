<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>またね テスト</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: #fff; color: #1f1d1a; }
    .ok { color: #1f8a4c; } .ng { color: #c93a39; font-weight: 700; }
    li { margin: 2px 0; font-size: 14px; }
    #sum { font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "htm": "https://esm.sh/htm@3.1.1",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
    }
  }
  </script>
  <div id="sum">実行中…</div>
  <ul id="out"></ul>
  <script type="module">
    import * as D from './src/lib/dates.js';
    import * as L from './src/lib/logic.js';
    import { guessEmoji } from './src/lib/emoji.js';
    import { normalizeIsbn, toKatakana, foldText, bookScore, splitWords } from './src/lib/books.js';
    import { placeQueries, toPlace, parseMapsUrl, isMapsLink, splitTitle } from './src/lib/places.js';
    import { pickPhoto, hashStr } from './src/lib/photos.js';
    import { deriveKey, encryptJSON, decryptJSON, newSalt } from './src/lib/lock.js';

    const out = document.getElementById('out');
    let pass = 0, fail = 0;
    function t(name, fn) {
      try {
        fn();
        pass++;
        out.insertAdjacentHTML('beforeend', `<li class="ok">✓ ${name}</li>`);
      } catch (e) {
        fail++;
        out.insertAdjacentHTML('beforeend', `<li class="ng">✗ ${name} — ${e.message}</li>`);
      }
    }
    const eq = (a, b) => { const x = JSON.stringify(a), y = JSON.stringify(b); if (x !== y) throw new Error(`${x} ≠ ${y}`); };

    // ---- 日付 ----
    t('addDays 月またぎ', () => eq(D.addDays('2026-10-31', 1), '2026-11-01'));
    t('addDays 年またぎ', () => eq(D.addDays('2026-12-31', 1), '2027-01-01'));
    t('diffDays', () => eq(D.diffDays('2026-10-02', '2026-10-05'), 3));
    t('diffDays 逆', () => eq(D.diffDays('2026-10-05', '2026-10-02'), -3));
    t('fmtDate', () => eq(D.fmtDate('2026-10-04'), '10/4（日）'));
    t('fmtLong', () => eq(D.fmtLong('2026-10-02'), '10月2日（金）'));
    t('fmtRange 同じ月', () => eq(D.fmtRange('2026-10-10', '2026-10-12'), '10/10（土）〜12日（月）'));
    t('countdown 今日', () => eq(D.countdown('2026-10-02', '2026-10-02').text, '今日！'));
    t('countdown 明日', () => eq(D.countdown('2026-10-03', '2026-10-02').text, '明日'));
    t('countdown あと5日', () => eq(D.countdown('2026-10-07', '2026-10-02').text, 'あと5日'));
    t('monthGrid 2026年10月は5週', () => {
      const g = D.monthGrid(2026, 10);
      eq(g.length, 5);
      eq(g[0][0].date, '2026-09-27');
      eq(g[0][4].date, '2026-10-01');
      eq(g[4][6].date, '2026-10-31');
    });
    t('monthGrid 2026年2月（1日が日曜・4週）', () => eq(D.monthGrid(2026, 2).length, 4));
    t('monthGrid 2027年2月（1日が月曜・5週）', () => eq(D.monthGrid(2027, 2).length, 5));
    t('seasonOfMonth', () => eq([1, 3, 6, 9, 12].map(D.seasonOfMonth), ['winter', 'spring', 'summer', 'autumn', 'winter']));
    t('daysUntilSeason 今の季節は0', () => eq(D.daysUntilSeason('autumn', '2026-10-02'), 0));
    t('daysUntilSeason 冬まで', () => eq(D.daysUntilSeason('winter', '2026-10-02'), 60));
    t('daysUntilSeason 春は来年', () => eq(D.daysUntilSeason('spring', '2026-10-02'), D.diffDays('2026-10-02', '2027-03-01')));
    t('daysUntilSeason 1月から見た春', () => eq(D.daysUntilSeason('spring', '2027-01-15'), D.diffDays('2027-01-15', '2027-03-01')));

    // ---- いつかの並び ----
    const today = '2026-10-02';
    const W = (o) => ({ id: o.id, title: o.id, createdAt: o.c ?? '2026-09-01T00:00:00Z', createdBy: o.by ?? 'A', seasons: o.s ?? [], until: o.u ?? null, doneAt: o.d ?? null });
    t('wishTiming 今の季節', () => eq(L.wishTiming(W({ id: 'a', s: ['autumn'] }), today).group, 'now'));
    t('wishTiming いつでも', () => eq(L.wishTiming(W({ id: 'a' }), today).group, 'anytime'));
    t('wishTiming 季節待ち（冬）', () => {
      const r = L.wishTiming(W({ id: 'a', s: ['winter'] }), today);
      eq([r.group, r.next, r.wait], ['later', 'winter', 60]);
    });
    t('wishTiming 期限が近いと季節に関係なく今', () => eq(L.wishTiming(W({ id: 'a', s: ['spring'], u: '2026-10-20' }), today).group, 'now'));
    t('wishTiming 期限切れ', () => eq(L.wishTiming(W({ id: 'a', u: '2026-09-30' }), today).group, 'expired'));
    t('wishTiming やった', () => eq(L.wishTiming(W({ id: 'a', d: '2026-09-01' }), today).group, 'done'));
    t('wishTiming 期限が遠いいつでも', () => eq(L.wishTiming(W({ id: 'a', u: '2026-12-25' }), today).group, 'anytime'));
    t('groupWishes 期限が近い順→ふたりとも→新しい順', () => {
      const ws = [W({ id: 'x', s: ['autumn'], c: '2026-09-03' }), W({ id: 'y', s: ['autumn'], c: '2026-09-01' }), W({ id: 'z', u: '2026-10-10' })];
      const likes = [{ wishId: 'y', memberId: 'B' }];
      const g = L.groupWishes(ws, { likes, memberCount: 2, today });
      eq(g.now.map((x) => x.w.id), ['z', 'y', 'x']);
      eq(g.now[1].both, true);
    });
    t('groupWishes 季節待ちは近い順', () => {
      const ws = [W({ id: 'spring', s: ['spring'] }), W({ id: 'winter', s: ['winter'] }), W({ id: 'summer', s: ['summer'] })];
      eq(L.groupWishes(ws, { today }).later.map((x) => x.w.id), ['winter', 'spring', 'summer']);
    });

    // ---- 会う日 ----
    const P = (id, date, o = {}) => ({ id, date, ...o });
    const plans = [P('p1', '2026-09-20', { bookClub: true }), P('p2', '2026-10-01'), P('p3', '2026-10-05', { bookClub: true }), P('p4', '2026-10-18', { bookClub: true }), P('trip', '2026-09-30', { endDate: '2026-10-03' })];
    t('upcomingPlans（旅行中も含む）', () => eq(L.upcomingPlans(plans, today).map((p) => p.id), ['trip', 'p3', 'p4']));
    t('plansToReview', () => eq(L.plansToReview(plans, today).map((p) => p.id), ['p2', 'p1']));
    t('bookClubsInMonth', () => eq(L.bookClubsInMonth(plans, '2026-10').map((p) => p.id), ['p3', 'p4']));

    // ---- 読書会の本 ----
    const books = [
      { id: 'b1', order: 1, pickedBy: 'A', doneAt: '2026-09-20' },
      { id: 'b2', order: 2, pickedBy: 'B' },
      { id: 'b3', order: 3, pickedBy: 'A' },
    ];
    const members = [{ id: 'A' }, { id: 'B' }];
    t('bookQueue 次回・次々回・第◯回', () => {
      const q = L.bookQueue(books);
      eq([q.next.id, q.afterNext.id, q.no.get('b1'), q.no.get('b2'), q.no.get('b3')], ['b2', 'b3', 1, 2, 3]);
    });
    t('nextPicker 交代制', () => eq(L.nextPicker(books, members), 'B'));
    t('nextPicker 本が無ければ未定', () => eq(L.nextPicker([], members), null));
    t('bookForNewClub 割り当て済みは飛ばす', () => {
      const ps = [P('c1', '2026-10-05', { bookClub: true, bookId: 'b2' })];
      eq(L.bookForNewClub(books, ps, today).id, 'b3');
    });
    t('bookForNewClub 過去の日に割り当てた本は使える', () => {
      const ps = [P('c0', '2026-09-28', { bookClub: true, bookId: 'b2' })];
      eq(L.bookForNewClub(books, ps, today).id, 'b2');
    });
    t('planTitle', () => {
      const wishById = new Map([['w1', { title: 'パンケーキ' }]]);
      eq(L.planTitle({ bookClub: true, todos: [{ wishId: 'w1' }, { text: '買い物' }] }, { wishById }), '読書会・パンケーキ ほか1件');
      eq(L.planTitle({ todos: [] }, {}), '会う日');
    });

    // ---- その他 ----
    t('guessEmoji', () => eq([guessEmoji('鎌倉のカフェ', 'go'), guessEmoji('ハンバーグ', 'go'), guessEmoji('温泉旅行', 'go'), guessEmoji('何か', 'do')], ['☕', '📍', '♨️', '✨']));
    t('normalizeIsbn', () => eq([normalizeIsbn('978-4-06-293438-1'), normalizeIsbn('4062934388')], ['9784062934381', '9784062934381']));

    // ---- 本のあいまい検索 ----
    t('toKatakana', () => eq(toKatakana('のるうぇいのもり'), 'ノルウェイノモリ'));
    t('foldText 表記ゆれ', () => eq(foldText('コンビニ人間（文庫）'), foldText('こんびに人間 文庫')));
    t('splitWords', () => eq(splitWords('村上春樹　ノルウェイ'), ['村上春樹', 'ノルウェイ']));
    t('bookScore 完全一致が先', () => {
      const a = { title: 'ノルウェイの森', authors: ['村上春樹'], publisher: '講談社', isbn: '1' };
      const b = { title: '散文の構造と『ノルウェイの森』', authors: ['秋本博夫'], publisher: '某社', isbn: '2' };
      if (!(bookScore(a, 'ノルウェイの森') < bookScore(b, 'ノルウェイの森'))) throw new Error('順番が逆');
    });
    t('bookScore 著者＋タイトル', () => {
      const a = { title: 'ノルウェイの森 上', authors: ['村上春樹'], publisher: '講談社', isbn: '1' };
      const b = { title: 'ノルウェイ紀行', authors: ['田中'], publisher: '某社', isbn: '2' };
      if (!(bookScore(a, '村上 ノルウェイ') < bookScore(b, '村上 ノルウェイ'))) throw new Error('順番が逆');
    });
    t('bookScore 大活字本は後ろ', () => {
      const a = { title: 'コンビニ人間', authors: ['村田沙耶香'], publisher: '文藝春秋', isbn: '1' };
      const b = { title: 'コンビニ人間', authors: ['村田沙耶香'], publisher: '埼玉福祉会', isbn: '2' };
      if (!(bookScore(a, 'コンビニ人間') < bookScore(b, 'コンビニ人間'))) throw new Error('順番が逆');
    });

    // ---- 場所の候補 ----
    t('placeQueries 「の」で区切る', () => eq(placeQueries('鎌倉のしらす丼'), ['鎌倉のしらす丼', '鎌倉', 'しらす丼']));
    t('placeQueries 動詞を外す', () => eq(placeQueries('紅葉の高尾山に登る'), ['紅葉の高尾山に登る', '紅葉', '高尾山']));
    t('placeQueries 空', () => eq(placeQueries('  '), []));
    t('toPlace', () => {
      const p = toPlace({ geometry: { coordinates: [139.24, 35.62] }, properties: { name: '高尾山', city: '八王子市', state: '東京都', osm_value: 'peak', countrycode: 'JP' } });
      eq([p.name, p.where, p.kind, p.skip], ['高尾山', '八王子市・東京都', '山', false]);
      eq(toPlace({ properties: { name: 'x', osm_value: 'bus_stop' } }).skip, true);
    });

    // ---- Googleマップのリンク ----
    t('parseMapsUrl 場所のページ（店名と正確な位置）', () => {
      const r = parseMapsUrl('https://www.google.com/maps/place/%E6%B1%9F%E5%B3%B6%E7%A5%9E%E7%A4%BE+%E8%BE%BA%E6%B4%A5%E5%AE%AE/@35.3003664,139.4795955,17z/data=!3m1!4b1!4m6!3m5!1s0x60:0xfa!8m2!3d35.3003664!4d139.4795955!16s');
      eq([r.name, r.lat, r.lon], ['江島神社 辺津宮', 35.30037, 139.4796]);
    });
    t('parseMapsUrl q=住所', () => eq(parseMapsUrl('https://maps.google.com/?q=%E9%AB%98%E5%B0%BE%E5%B1%B1').name, '高尾山'));
    t('parseMapsUrl 地図だけ（@位置）', () => { const r = parseMapsUrl('https://www.google.com/maps/@35.62,139.24,15z'); eq([r.name, r.lat, r.lon], [null, 35.62, 139.24]); });
    t('parseMapsUrl Googleマップ以外は読まない', () => eq(parseMapsUrl('https://example.com/'), null));
    t('isMapsLink 短いリンク・文章の中', () => {
      eq(isMapsLink('ここ行きたい https://maps.app.goo.gl/1DnoMPt9LnXJqD7S9'), 'https://maps.app.goo.gl/1DnoMPt9LnXJqD7S9');
      eq(isMapsLink('https://www.instagram.com/p/xyz'), null);
      eq(!!isMapsLink('https://www.google.co.jp/maps/place/x'), true);
    });
    t('splitTitle 名前 · 住所', () => eq(splitTitle('江島神社 · 〒251-0036 神奈川県藤沢市江の島２丁目'), { name: '江島神社', address: '〒251-0036 神奈川県藤沢市江の島２丁目' }));

    // ---- アイコンの入れ替え ----
    const photos = [{ id: 'a' }, { id: 'b' }, { id: 'c' }];
    t('pickPhoto 固定', () => eq(pickPhoto({ id: 'm1', photoRotate: 'fixed', photoFixed: 'b' }, photos).id, 'b'));
    t('pickPhoto 毎日は同じ日なら同じ・ふたりで同じ', () => {
      const d = new Date(2026, 9, 2, 9), d2 = new Date(2026, 9, 2, 22);
      eq(pickPhoto({ id: 'm1', photoRotate: 'day' }, photos, d).id, pickPhoto({ id: 'm1', photoRotate: 'day' }, photos, d2).id);
    });
    t('pickPhoto 1時間ごとはいろいろ出る', () => {
      const seen = new Set();
      for (let h = 0; h < 24; h++) seen.add(pickPhoto({ id: 'm1', photoRotate: 'hour' }, photos, new Date(2026, 9, 2, h)).id);
      eq(seen.size, 3);
    });
    t('pickPhoto 写真なし', () => eq(pickPhoto({ id: 'm1' }, []), null));
    t('hashStr は決まった値', () => eq(hashStr('abc'), hashStr('abc')));

    // ---- 鍵（暗号） ----
    try {
      const salt = newSalt();
      const k1 = await deriveKey('ほしとにじ', salt);
      const box = await encryptJSON(k1, { text: 'ないしょ', page: 12 });
      const k2 = await deriveKey('ほしとにじ', salt);
      eq(await decryptJSON(k2, box), { text: 'ないしょ', page: 12 });
      if (box.ct.includes('ないしょ')) throw new Error('平文が残っている');
      let wrongOpened = true;
      try { await decryptJSON(await deriveKey('ちがう', salt), box); } catch { wrongOpened = false; }
      if (wrongOpened) throw new Error('ちがう合言葉で開けてしまった');
      pass++; out.insertAdjacentHTML('beforeend', '<li class="ok">✓ 鍵：同じ合言葉なら別の端末でも開ける・ちがう合言葉では開けない</li>');
    } catch (e) { fail++; out.insertAdjacentHTML('beforeend', `<li class="ng">✗ 鍵 — ${e.message}</li>`); }

    document.getElementById('sum').innerHTML = fail ? `<span class="ng">${fail}件 失敗</span> / ${pass}件 成功` : `<span class="ok">全${pass}件 成功</span>`;
  </script>
</body>
</html>
